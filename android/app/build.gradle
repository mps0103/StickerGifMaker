apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()

    // Variants named here are NOT bundled. Emptying the list packages the JS into
    // the debug APK as well, so a debug build installed on a phone still runs once
    // Metro is gone. Dev support is untouched: while the dev server is reachable it
    // is still used, and the packaged bundle is only the fallback.
    debuggableVariants = []
}

def enableProguardInReleaseBuilds = true

// Release signing only switches on when every credential is present, otherwise
// Gradle fails with a null-property error halfway through the build.
def hasReleaseSigning = project.hasProperty('MPS_UPLOAD_STORE_FILE') &&
        project.hasProperty('MPS_UPLOAD_STORE_PASSWORD') &&
        project.hasProperty('MPS_UPLOAD_KEY_ALIAS') &&
        project.hasProperty('MPS_UPLOAD_KEY_PASSWORD')

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mps.stickergif"

    defaultConfig {
        applicationId "com.mps.stickergif"
        minSdkVersion rootProject.ext.minSdkVersion
        // Google Play requires API 36 for new apps and updates from 31 Aug 2026
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            // 32-bit x86 is emulator-only and doubles CMake time for nothing
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(MPS_UPLOAD_STORE_FILE)
                storePassword MPS_UPLOAD_STORE_PASSWORD
                keyAlias MPS_UPLOAD_KEY_ALIAS
                keyPassword MPS_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            // Required for Android 15+/16 devices that use 16 KB memory pages
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    bundle {
        language { enableSplit = false }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // AppTheme inherits from Material3, so the library has to be on the classpath
    implementation("com.google.android.material:material:1.12.0")
    // Branded splash on Android 12+, back-ported to API 24
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("androidx.activity:activity-ktx:1.10.1")

    // On-device background removal - no network, no model hosting
    implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")

    // GIF encode (Apache-2.0) and GIF decode/seek (MIT) - both fully offline
    implementation("com.squareup:gifencoder:0.10.1")
    implementation("pl.droidsonroids.gif:android-gif-drawable:1.2.29")

    // One-time ad-free unlock
    implementation("com.android.billingclient:billing-ktx:7.1.1")

    implementation("androidx.core:core-ktx:1.16.0")
    implementation("androidx.exifinterface:exifinterface:1.4.1")
}
