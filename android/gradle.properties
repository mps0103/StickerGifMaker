org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 defaults to a new DSL that the Kotlin Android plugin cannot apply against,
# and it registers its own "kotlin" extension on top. This app and every autolinked
# RN module in node_modules still applies org.jetbrains.kotlin.android, so keep the
# legacy DSL and leave KGP in charge until those libraries migrate.
android.newDsl=false
android.builtInKotlin=false

newArchEnabled=true
hermesEnabled=true

# Release signing values live in ~/.gradle/gradle.properties, never in the repo
MPS_UPLOAD_STORE_FILE=mps-upload-key.keystore
MPS_UPLOAD_KEY_ALIAS=mps-upload
